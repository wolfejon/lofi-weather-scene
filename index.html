<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a2440">
<title>Tiny Weather Window</title>
<style>
  :root{
    --ink:#2b2238; --paper:#fff6e9; --glass:rgba(255,248,236,.78); --accent:#e98a6b; --soft:#8a7a9c;
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#1d1a2b;color:var(--ink);-webkit-tap-highlight-color:transparent}
  canvas#scene{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(20,12,30,.35) 100%)}
  .scan{position:fixed;inset:0;pointer-events:none;opacity:.06;background:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 3px)}
  .hud{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));
    background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-radius:18px;padding:12px 16px 12px 14px;box-shadow:0 6px 0 rgba(43,34,56,.18),0 10px 30px rgba(20,10,40,.18);
    border:2px solid rgba(43,34,56,.12);max-width:min(78vw,330px);transition:opacity .4s}
  .hud h1{margin:0 0 2px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:800}
  .hud .big{display:flex;align-items:center;gap:10px}
  .hud .icon{font-size:30px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08))}
  .hud .temp{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .hud .desc{font-size:14px;font-weight:700;line-height:1.25}
  .hud .place{font-size:12.5px;color:var(--soft);margin-top:4px;font-weight:600}
  .hud .tag{display:inline-block;background:#fbe3d3;color:#9c4b31;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;margin-left:4px;vertical-align:1px}
  .controls{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
  .sound{pointer-events:auto;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:17px;color:var(--ink);
    background:var(--paper);padding:14px 22px;border-radius:999px;box-shadow:0 5px 0 #c9a98c,0 12px 28px rgba(20,10,40,.25);
    display:flex;align-items:center;gap:10px;transition:transform .12s, box-shadow .12s}
  .sound:active{transform:translateY(3px);box-shadow:0 2px 0 #c9a98c,0 6px 16px rgba(20,10,40,.25)}
  .sound .dot{width:12px;height:12px;border-radius:50%;background:#d9cbbd}
  .sound.on .dot{background:#7ccf8f;box-shadow:0 0 0 4px rgba(124,207,143,.25);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 7px rgba(124,207,143,.08)}}
  .chips{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:min(96vw,760px);padding:0 8px}
  .group{display:flex;gap:4px;background:rgba(255,246,233,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:4px;border-radius:999px}
  .chip{border:0;font:inherit;font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--paper);box-shadow:0 2px 0 rgba(43,34,56,.18)}
  .toggle{pointer-events:auto;border:0;background:rgba(255,246,233,.55);font:inherit;font-weight:800;font-size:12px;color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .chips[hidden],.vol[hidden]{display:none}
  .vol{pointer-events:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;background:rgba(255,246,233,.55);padding:4px 12px;border-radius:999px;backdrop-filter:blur(6px)}
  .vol input{accent-color:#e98a6b;width:110px}
  .hide-ui .hud,.hide-ui .controls>*:not(.sound){opacity:0;pointer-events:none}
  @media (max-width:520px){.hud{padding:10px 12px}.hud .temp{font-size:26px}.chip{font-size:12px;padding:6px 8px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="A cozy pixel-art scene that matches your current weather and season" role="img"></canvas>
<div class="vignette"></div><div class="scan"></div>

<section class="hud" id="hud" aria-live="polite">
  <h1>Tiny Weather Window</h1>
  <div class="big"><span class="icon" id="icon">☁️</span><span class="temp" id="temp">--°</span></div>
  <div class="desc" id="desc">Peeking outside…</div>
  <div class="place" id="place">finding your little corner of the world</div>
</section>

<div class="controls">
  <div class="chips" id="chips" hidden>
    <div class="group" data-k="season">
      <button class="chip" data-v="auto" aria-pressed="true">auto</button>
      <button class="chip" data-v="spring">🌸 spring</button>
      <button class="chip" data-v="summer">🌻 summer</button>
      <button class="chip" data-v="autumn">🍂 autumn</button>
      <button class="chip" data-v="winter">❄️ winter</button>
    </div>
    <div class="group" data-k="weather">
      <button class="chip" data-v="auto" aria-pressed="true">auto</button>
      <button class="chip" data-v="clear">☀️</button>
      <button class="chip" data-v="cloudy">☁️</button>
      <button class="chip" data-v="rain">🌧️</button>
      <button class="chip" data-v="snow">🌨️</button>
      <button class="chip" data-v="fog">🌫️</button>
      <button class="chip" data-v="storm">⛈️</button>
    </div>
    <div class="group" data-k="time">
      <button class="chip" data-v="auto" aria-pressed="true">auto</button>
      <button class="chip" data-v="day">day</button>
      <button class="chip" data-v="night">night</button>
    </div>
  </div>
  <div style="display:flex;gap:8px;pointer-events:none;flex-wrap:wrap;justify-content:center">
    <button class="toggle" id="chipToggle" aria-expanded="false">✨ play with the weather</button>
    <label class="vol" id="volWrap" hidden>vol <input id="vol" type="range" min="0" max="100" value="55" aria-label="Volume"></label>
  </div>
  <button class="sound" id="sound" aria-pressed="false"><span class="dot"></span><span id="soundLabel">Start lofi sound</span></button>
</div>

<script>
(() => {
'use strict';
// ---------------------------------------------------------------- utils
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOTION = reduceMotion ? 0.35 : 1;
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
function rng(seed){ let s = seed >>> 0 || 1; return () => (s = (s*1664525 + 1013904223) >>> 0) / 4294967296; }
function hex(c){ const n = parseInt(c.slice(1),16); return [n>>16, (n>>8)&255, n&255]; }
function toHex(r,g,b){ return '#' + [r,g,b].map(v => clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join(''); }
function mix(a,b,t){ const A = hex(a), B = hex(b); return toHex(lerp(A[0],B[0],t), lerp(A[1],B[1],t), lerp(A[2],B[2],t)); }
function grey(a,t){ const [r,g,b] = hex(a); const y = r*.3+g*.59+b*.11; return toHex(lerp(r,y,t), lerp(g,y,t), lerp(b,y,t)); }

// ---------------------------------------------------------------- state
const state = {
  auto: { season: null, weather: 'cloudy', night: false, temp: null, code: 3, place: '' },
  over: { season: 'auto', weather: 'auto', time: 'auto' },
  lat: 47.61, lon: -122.33,
};
const eff = () => ({
  season: state.over.season !== 'auto' ? state.over.season : (state.auto.season || seasonFor(state.lat, new Date())),
  weather: state.over.weather !== 'auto' ? state.over.weather : state.auto.weather,
  night: state.over.time !== 'auto' ? state.over.time === 'night' : state.auto.night,
});

function seasonFor(lat, d){
  let m = d.getMonth(); // 0..11
  if (lat < 0) m = (m + 6) % 12;
  if (Math.abs(lat) < 12) return 'summer';
  return m <= 1 || m === 11 ? 'winter' : m <= 4 ? 'spring' : m <= 7 ? 'summer' : 'autumn';
}
function weatherFromCode(c){
  if (c === 0 || c === 1) return 'clear';
  if (c === 2 || c === 3) return 'cloudy';
  if (c === 45 || c === 48) return 'fog';
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return 'rain';
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'snow';
  if (c >= 95) return 'storm';
  return 'cloudy';
}
const LABELS = {0:'Clear sky',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Foggy',48:'Frosty fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Rain showers',81:'Rain showers',82:'Big showers',85:'Snow showers',86:'Snow showers',95:'Thunderstorm',96:'Thunder + hail',99:'Thunder + hail'};
const ICON = { clear:['☀️','🌙'], cloudy:['⛅','☁️'], rain:['🌧️','🌧️'], snow:['🌨️','🌨️'], fog:['🌫️','🌫️'], storm:['⛈️','⛈️'] };
const SEASON_WORD = { spring:'spring 🌸', summer:'summer 🌻', autumn:'autumn 🍂', winter:'winter ❄️' };
const COZY = {
  clear:['a soft, open-sky kind of day','stars are out — perfect for tea'],
  cloudy:['clouds drifting by, nice and slow','a quiet cloudy night'],
  rain:['pitter-patter on the rooftops','rain on the windows, lamps on'],
  snow:['snow falling softly','snow under the lamplight'],
  fog:['the village is wrapped in mist','misty lanterns glow'],
  storm:['a moody storm rolls through','thunder far away, cozy inside'],
};

// ---------------------------------------------------------------- palettes
const PAL = {
  spring: { skyT:'#8fc6ee', skyB:'#f6d8e6', far:'#a9c3d9', mid:'#8fc98a', near:'#6db36e', grass:'#7cc274', grass2:'#5a9e5c', road:'#e7cfa6', road2:'#cfb187',
            leaf:['#7fc77a','#5ea962','#a6dd8c'], bloom:['#f7b6cf','#f9d3e1','#ee93b6'], trunk:'#7a5640', wall:['#fbeedd','#f4e1c6','#e9d4f0'], roof:['#e7837a','#7aa7d8','#b98bd6'], flower:['#ffffff','#ffd86b','#f39bbd','#b9a2ff'] },
  summer: { skyT:'#59b4f0', skyB:'#cdeefd', far:'#8db7d9', mid:'#5fb36a', near:'#3f9a55', grass:'#5fb85d', grass2:'#45964b', road:'#ead2a0', road2:'#d2b47c',
            leaf:['#4fa857','#3b8d47','#78c46a'], bloom:['#ffd35c','#ff9f6b','#ffffff'], trunk:'#6e4b33', wall:['#fff3df','#ffe9c2','#e6f1f5'], roof:['#e86b5a','#4f8fd1','#f2a541'], flower:['#ffe066','#ff8fa3','#ffffff','#ff9f43'] },
  autumn: { skyT:'#f0a982', skyB:'#ffe2b8', far:'#c79b97', mid:'#c68a4b', near:'#a8693a', grass:'#b9a453', grass2:'#9a8641', road:'#e3c393', road2:'#c9a271',
            leaf:['#e9772f','#d6532b','#f2b33d','#c43d2b'], bloom:['#f2b33d','#e9772f'], trunk:'#5d3f2c', wall:['#fbe9cf','#f1d7b3','#efe0cf'], roof:['#a8462f','#6b4a8a','#4f6e5a'], flower:['#f2b33d','#e46a3a','#fff1c1'] },
  winter: { skyT:'#9fb9da', skyB:'#e8eff8', far:'#c6d3e6', mid:'#e3ebf5', near:'#cfdcec', grass:'#eef4fb', grass2:'#d4e1ef', road:'#c9d4e2', road2:'#b0bed1',
            leaf:['#3f6b5f','#2f5a50','#55806f'], bloom:['#ffffff'], trunk:'#5b4a44', wall:['#f6efe6','#efe4d6','#e2e9f2'], roof:['#b7524a','#4e6a9a','#6f5a8c'], flower:['#ffffff'] },
};
const NIGHT = '#141a3a';
function palette(season, weather, night){
  const p = JSON.parse(JSON.stringify(PAL[season]));
  const dull = weather === 'clear' ? 0 : weather === 'cloudy' ? .35 : weather === 'fog' ? .55 : .5;
  if (dull){ p.skyT = mix(grey(p.skyT, dull), '#9aa3b5', dull*.5); p.skyB = mix(grey(p.skyB, dull), '#c8ccd6', dull*.5); p.far = grey(p.far, dull*.6); }
  if (night){
    p.skyT = mix(p.skyT, '#0d1030', .86); p.skyB = mix(p.skyB, '#3b3f78', .7);
    const dim = (c, t=.58) => mix(c, NIGHT, t);
    for (const k of ['far','mid','near','grass','grass2','road','road2','trunk']) p[k] = dim(p[k], k==='far'?.62:.58);
    for (const k of ['leaf','bloom','wall','roof','flower']) p[k] = p[k].map(c => dim(c));
  }
  return p;
}

// ---------------------------------------------------------------- canvas setup
const cv = $('#scene'), ctx = cv.getContext('2d');
const base = document.createElement('canvas'), bctx = base.getContext('2d');
let W = 320, H = 180, PX = 4, horizon = 110, groundY = 132;
function resize(){
  const vw = innerWidth, vh = innerHeight;
  PX = vh > vw ? Math.max(2, Math.floor(vw / 125)) : Math.max(2, Math.floor(Math.max(vw, vh) / 300));
  W = Math.ceil(vw / PX); H = Math.ceil(vh / PX);
  cv.width = W; cv.height = H; base.width = W; base.height = H;
  ctx.imageSmoothingEnabled = false;
  horizon = Math.floor(H * (H > W ? .52 : .56)); groundY = Math.floor(H * (H > W ? .66 : .76));
  buildScene();
}

// ---------------------------------------------------------------- static scene
let P, houses = [], scene = {};
function px(c, x, y, w=1, h=1, g=bctx){ g.fillStyle = c; g.fillRect(x|0, y|0, w|0, h|0); }
function blob(g, cx, cy, r, cols, R){
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++){
    const d = (x*x)/(r*r) + (y*y)/((r*.85)*(r*.85));
    if (d > 1 + (R() - .5) * .25) continue;
    const shade = (x + y) / (2*r);
    const c = shade < -.35 ? cols[2] || cols[0] : shade > .25 ? cols[1] : cols[0];
    px(c, cx + x, cy + y, 1, 1, g);
  }
}
function tree(g, x, y, kind, R, season){
  const s = 0.8 + R()*.6;
  if (kind === 'pine'){
    const h = Math.round(18*s), lw = Math.round(7*s);
    px(P.trunk, x-1, y-3, 2, 4, g);
    for (let i = 0; i < h; i++){
      const t = i / h, w = Math.max(1, Math.round(lw * t + (i%4===3 ? -1 : 0)));
      px(P.leaf[1], x - w, y - h - 2 + i, w*2, 1, g);
      px(P.leaf[0], x - w, y - h - 2 + i, Math.max(1, w-1), 1, g);
      if (season === 'winter' && (i%4===0 || i < 3)) px('#ffffff', x - w + 1, y - h - 2 + i, Math.max(1, w), 1, g);
    }
    return;
  }
  const r = Math.round(6*s), th = Math.round(7*s);
  px(P.trunk, x-1, y-th, 2, th, g); px(mix(P.trunk,'#000000',.25), x, y-th, 1, th, g);
  if (season === 'winter'){
    // bare branches with snow
    for (let i = 0; i < 5; i++){ const bx = x + Math.round((R()-.5)*r*1.8), by = y - th - Math.round(R()*r*1.2);
      const dx = Math.sign(bx - x) || 1; let cx = x, cy = y - th + 1;
      while (cy > by){ px(P.trunk, cx, cy, 1, 1, g); cy--; if (R() < .5) cx += dx; }
      px('#ffffff', cx, cy, 2, 1, g); }
    return;
  }
  const cy = y - th - r + 2;
  const cols = season === 'autumn' ? [P.leaf[(R()*4)|0], P.leaf[3] || P.leaf[1], P.leaf[2]]
            : season === 'spring' && R() < .45 ? [P.bloom[0], P.bloom[2], P.bloom[1]] : [P.leaf[0], P.leaf[1], P.leaf[2]];
  blob(g, x, cy, r, cols, R); blob(g, x - Math.round(r*.6), cy + 2, Math.round(r*.7), cols, R); blob(g, x + Math.round(r*.6), cy + 2, Math.round(r*.7), cols, R);
  if (season === 'summer' && R() < .3) for (let i = 0; i < 4; i++) px(P.bloom[0], x + (R()-.5)*r*2, cy + (R()-.5)*r*1.4, 1, 1, g);
}
function house(g, x, y, R, season, night){
  const w = 14 + ((R()*3)|0)*2, h = 9 + ((R()*3)|0), wall = P.wall[(R()*P.wall.length)|0], roof = P.roof[(R()*P.roof.length)|0];
  px(mix(wall,'#000000',.12), x+w-3, y-h, 3, h, g); px(wall, x, y-h, w-3, h, g);
  // roof (stepped)
  const rh = Math.ceil(w/2)+1;
  for (let i = 0; i < rh; i++){ const ww = w + 4 - i*2; if (ww <= 0) break;
    px(roof, x - 2 + i, y - h - 1 - i, ww, 1, g);
    px(mix(roof,'#000000',.18), x - 2 + i, y - h - 1 - i, 1, 1, g);
    if (season === 'winter' && i < rh) px('#ffffff', x - 2 + i, y - h - 2 - i, Math.min(3, ww), 1, g), px('#ffffff', x - 2 + i + ww - 3, y - h - 2 - i, Math.min(3,ww), 1, g); }
  if (season === 'winter') px('#ffffff', x + Math.floor(w/2) - 2, y - h - rh, 5, 1, g);
  // chimney
  const chx = x + w - 5; px(mix(roof,'#3b2a2a',.45), chx, y - h - rh + 1, 3, 4, g);
  // door + windows
  px(mix(roof,'#2a1a1a',.35), x + 3, y - 6, 3, 6, g); px('#f5c26b', x + 5, y - 3, 1, 1, g);
  const lit = night ? '#ffd27a' : '#bfe3f2';
  const wx = x + 8; px(mix(wall,'#3b2f2f',.5), wx-1, y - h + 2, 5, 5, g); px(lit, wx, y - h + 3, 3, 3, g);
  if (!night) px('#ffffff', wx, y - h + 3, 1, 1, g); else px('#fff1c4', wx, y - h + 3, 1, 1, g);
  px(mix(wall,'#3b2f2f',.5), wx, y - h + 4, 3, 1, g);
  houses.push({ x: wx + 1, y: y - h + 4, chim: { x: chx + 1, y: y - h - rh } });
  if (season !== 'winter') for (let i = 0; i < w-2; i += 2) px(P.flower[(R()*P.flower.length)|0], x + 1 + i, y - 1, 1, 1, g);
}
function buildScene(){
  const e = eff(); P = palette(e.season, e.weather, e.night); houses = [];
  const g = bctx, R = rng(1234 + W);
  // sky with dithered bands
  const bands = 14;
  for (let y = 0; y < horizon + 10; y++){
    const t = y / (horizon + 10), bi = Math.floor(t * bands), frac = t*bands - bi;
    const c0 = mix(P.skyT, P.skyB, bi / bands), c1 = mix(P.skyT, P.skyB, (bi+1) / bands);
    px(c0, 0, y, W, 1, g);
    if (frac > .5) for (let x = (y & 1); x < W; x += 2) px(c1, x, y, 1, 1, g);
  }
  // sun / moon
  const sx = Math.floor(W * .78), sy = Math.floor(horizon * .3);
  if (e.night){ blob(g, sx, sy, 6, ['#fff4d6','#e9dcb8','#ffffff'], rng(7)); px(mix('#fff4d6','#c9bc98',.4), sx+1, sy-2, 2, 2, g); px(mix('#fff4d6','#c9bc98',.4), sx-3, sy+1, 2, 1, g); }
  else if (e.weather === 'clear' || e.weather === 'cloudy'){
    g.globalAlpha = .25; blob(g, sx, sy, 13, [P.skyB,P.skyB,'#ffffff'], rng(3)); g.globalAlpha = 1;
    blob(g, sx, sy, 8, e.season==='autumn'?['#ffd27a','#ffb35c','#fff1c1']:['#fff3b0','#ffd96b','#ffffff'], rng(5)); }
  // far mountains
  for (let x = 0; x < W; x++){
    const h = 26 + Math.sin(x*.035)*10 + Math.sin(x*.11+1)*4 + Math.sin(x*.013+3)*8;
    const top = horizon - h;
    px(P.far, x, top, 1, horizon - top + 4, g);
    if (e.season === 'winter' || h > 38){ px(mix(P.far,'#ffffff',e.night?.25:.6), x, top, 1, Math.max(1, Math.round((h-28)*.35)), g); }
  }
  // mid hills
  for (let x = 0; x < W; x++){
    const h = 14 + Math.sin(x*.05+2)*6 + Math.sin(x*.017)*6;
    px(P.mid, x, horizon - h + 10, 1, groundY - (horizon - h + 10), g);
    if ((x + Math.floor(h)) % 7 === 0) px(mix(P.mid, P.near, .5), x, horizon - h + 12, 1, 1, g);
  }
  // distant tree line
  for (let x = 2; x < W; x += 5 + ((R()*5)|0)){
    const yy = horizon + 12 + Math.floor(Math.sin(x*.05+2)*-3);
    tree(g, x, yy, e.season === 'winter' || R() < .35 ? 'pine' : 'round', rng(x*31), e.season);
  }
  // near meadow
  for (let y = groundY - 10; y < H; y++) px(y < groundY - 6 ? P.near : P.grass, 0, y, W, 1, g);
  for (let x = 0; x < W; x++) px(P.near, x, groundY - 11 + Math.round(Math.sin(x*.09)*1.5), 1, 2, g);
  // village
  const nH = Math.max(3, Math.min(6, Math.floor(W / 55)));
  const spacing = W / nH;
  for (let i = 0; i < nH; i++){

  function schedule(){
    while (nextTime < ac.currentTime + .25){
      const season = scene.e.season, prog = PROG[season], bar = Math.floor(step / 8) % 4, s8 = step % 8, ch = prog[bar], t = nextTime + (s8 % 2 ? STEP * .12 : 0); // swing
      if (s8 === 0){ ch.forEach((m, i) => keys(m, t + i * .025, STEP * 7, .085)); bass(ch[0] - 24, t, STEP * 3.5); }
      if (s8 === 3 && Math.random() < .6) ch.slice(1).forEach((m, i) => keys(m, t + i*.02, STEP*2.5, .05));
      if (s8 === 4) bass(ch[0] - 24 + (Math.random()<.5?7:0), t, STEP * 3);
      if (Math.random() < (s8 % 2 ? .18 : .32)) keys(PENTA[(Math.random()*PENTA.length)|0] - (season==='winter'?12:0) + 12*(Math.random()<.15), t, STEP*3, .05);
      const drums = scene.e.weather !== 'fog';
      if (drums){ if (s8 === 0 || (s8 === 5 && Math.random() < .5)) kick(t); if (s8 === 4) snare(t); hat(t, s8 % 2 ? .012 : .022); }
      nextTime += STEP; step++;
    }
  }
  return {
    get on(){ return playing; },
    async toggle(){
      if (!ac) init();
      if (ac.state === 'suspended') await ac.resume();
      playing = !playing;
      const now = ac.currentTime; master.gain.cancelScheduledValues(now); master.gain.setValueAtTime(master.gain.value, now);
      if (playing){ master.gain.linearRampToValueAtTime(vol * .9, now + 2.5); nextTime = now + .1; schedule(); timer = setInterval(schedule, 80); this.weather(); }
      else { master.gain.linearRampToValueAtTime(0, now + .6); clearInterval(timer); }
      return playing;
    },
    setVol(v){ vol = v; if (ac && playing) master.gain.setTargetAtTime(vol * .9, ac.currentTime, .1); },
    weather(){ if (!ac) return; const w = scene.e.weather; rainGain.gain.setTargetAtTime(w === 'rain' ? .07 : w === 'storm' ? .1 : 0, ac.currentTime, 1); },
    thunder(){ if (!ac || !playing) return; const t = ac.currentTime + .4 + Math.random(), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = 180; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.35, t + .3); g.gain.exponentialRampToValueAtTime(.0001, t + 3);
      s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + 3.1); },
  };
})();

// ---------------------------------------------------------------- HUD
function renderHUD(){
  const e = eff(), a = state.auto, overridden = state.over.season !== 'auto' || state.over.weather !== 'auto' || state.over.time !== 'auto';
  $('#icon').textContent = ICON[e.weather][e.night ? 1 : 0];
  $('#temp').textContent = a.temp == null ? '--°' : `${Math.round(a.temp)}°${a.unit || 'C'}`;
  const label = state.over.weather === 'auto' && a.code != null && LABELS[a.code] ? LABELS[a.code] : e.weather[0].toUpperCase() + e.weather.slice(1);
  $('#desc').innerHTML = `${label} · ${SEASON_WORD[e.season]}${overridden ? '<span class="tag">pretend</span>' : ''}<br><span style="font-weight:600;color:var(--soft)">${COZY[e.weather][e.night?1:0]}</span>`;
  $('#place').textContent = a.place || '';
}
function applyAll(){ buildScene(); renderHUD(); audio.weather(); }

// ---------------------------------------------------------------- weather fetch
const TZ = { 'America/Los_Angeles':[34.05,-118.24,'Los Angeles'], 'America/Vancouver':[49.28,-123.12,'Vancouver'], 'America/Denver':[39.74,-104.99,'Denver'], 'America/Phoenix':[33.45,-112.07,'Phoenix'],
  'America/Chicago':[41.88,-87.63,'Chicago'], 'America/New_York':[40.71,-74.01,'New York'], 'America/Toronto':[43.65,-79.38,'Toronto'], 'America/Anchorage':[61.22,-149.9,'Anchorage'], 'Pacific/Honolulu':[21.31,-157.86,'Honolulu'],
  'America/Mexico_City':[19.43,-99.13,'Mexico City'], 'America/Sao_Paulo':[-23.55,-46.63,'São Paulo'], 'Europe/London':[51.51,-0.13,'London'], 'Europe/Paris':[48.86,2.35,'Paris'], 'Europe/Berlin':[52.52,13.4,'Berlin'],
  'Europe/Madrid':[40.42,-3.7,'Madrid'], 'Europe/Rome':[41.9,12.5,'Rome'], 'Europe/Amsterdam':[52.37,4.9,'Amsterdam'], 'Asia/Tokyo':[35.68,139.69,'Tokyo'], 'Asia/Seoul':[37.57,126.98,'Seoul'], 'Asia/Shanghai':[31.23,121.47,'Shanghai'],
  'Asia/Kolkata':[28.61,77.21,'Delhi'], 'Asia/Singapore':[1.35,103.82,'Singapore'], 'Australia/Sydney':[-33.87,151.21,'Sydney'], 'Australia/Melbourne':[-37.81,144.96,'Melbourne'], 'Pacific/Auckland':[-36.85,174.76,'Auckland'] };
function getPosition(){
  return new Promise(res => {
    const fallback = () => { const tz = Intl.DateTimeFormat().resolvedOptions().timeZone; const g = TZ[tz];
      res(g ? { lat: g[0], lon: g[1], name: `near ${g[2]} (from your time zone)` } : { lat: 47.61, lon: -122.33, name: 'Seattle (default)' }); };
    if (!navigator.geolocation) return fallback();
    const to = setTimeout(fallback, 9000);
    navigator.geolocation.getCurrentPosition(p => { clearTimeout(to); res({ lat: p.coords.latitude, lon: p.coords.longitude, name: null }); },
      () => { clearTimeout(to); fallback(); }, { maximumAge: 30*60*1000, timeout: 8000, enableHighAccuracy: false });
  });
}
async function loadWeather(){
  const pos = await getPosition(); state.lat = pos.lat; state.lon = pos.lon;
  state.auto.season = seasonFor(pos.lat, new Date());
  const h = new Date().getHours(); state.auto.night = h < 6 || h >= 19; // guess until fetched
  state.auto.place = pos.name || 'your spot'; applyAll();
  const imperial = /^en-US/.test(navigator.language) || /^America\/(?!Sao|Mexico|Toronto|Vancouver)/.test(Intl.DateTimeFormat().resolvedOptions().timeZone);
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${pos.lat.toFixed(3)}&longitude=${pos.lon.toFixed(3)}&current=temperature_2m,weather_code,is_day&timezone=auto${imperial ? '&temperature_unit=fahrenheit' : ''}`;
    const r = await fetch(u); const j = await r.json(); const c = j.current;
    state.auto.temp = c.temperature_2m; state.auto.unit = imperial ? 'F' : 'C'; state.auto.code = c.weather_code;
    state.auto.weather = weatherFromCode(c.weather_code); state.auto.night = c.is_day === 0;
  } catch (err){ state.auto.code = null; state.auto.place = (state.auto.place || '') + ' · offline, imagining the weather'; }
  applyAll();
  if (!pos.name){
    try { const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${pos.lat}&longitude=${pos.lon}&localityLanguage=en`);
      const j = await r.json(); const n = j.city || j.locality || j.principalSubdivision; if (n){ state.auto.place = `📍 ${n}${j.principalSubdivisionCode ? ', ' + j.principalSubdivisionCode.split('-').pop() : ''}`; renderHUD(); } } catch {}
  }
}

// ---------------------------------------------------------------- controls
$('#sound').addEventListener('click', async () => {
  const on = await audio.toggle(); $('#sound').classList.toggle('on', on); $('#sound').setAttribute('aria-pressed', on);
  $('#soundLabel').textContent = on ? 'Lofi on · tap to mute' : 'Start lofi sound'; $('#volWrap').hidden = !on;
});
$('#vol').addEventListener('input', e => audio.setVol(e.target.value / 100));
$('#chipToggle').addEventListener('click', () => { const c = $('#chips'), open = c.hidden; c.hidden = !open; $('#chipToggle').setAttribute('aria-expanded', open); $('#chipToggle').textContent = open ? '✕ close' : '✨ play with the weather'; });
document.querySelectorAll('.group').forEach(g => g.addEventListener('click', ev => {
  const b = ev.target.closest('.chip'); if (!b) return;
  g.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b)); state.over[g.dataset.k] = b.dataset.v; applyAll();
}));
// tap the scene to summon a friend; double-tap to hide UI
let lastTap = 0;
cv.addEventListener('pointerdown', () => { const n = performance.now(); if (n - lastTap < 320) document.body.classList.toggle('hide-ui'); else if (!critter) spawnCritter(); lastTap = n; });
addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 150); });
setInterval(loadWeather, 15 * 60 * 1000);

// URL overrides for sharing, e.g. ?season=winter&weather=snow&time=night
const qs = new URLSearchParams(location.search);
for (const k of ['season','weather','time']) if (qs.get(k)){ state.over[k] = qs.get(k); document.querySelectorAll(`.group[data-k=${k}] .chip`).forEach(x => x.setAttribute('aria-pressed', x.dataset.v === qs.get(k))); }
resize(); renderHUD(); requestAnimationFrame(t => { last = t; frame(t); }); loadWeather();
})();
</script>
