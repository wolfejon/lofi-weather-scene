<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3a2418">
<title>Tiny Weather Window · Bookstore</title>
<style>
  :root{
    --ink:#2b2238; --paper:#fff6e9; --glass:rgba(255,248,236,.78); --accent:#e98a6b; --soft:#8a7a9c;
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#2a1c16;color:var(--ink);-webkit-tap-highlight-color:transparent}
  canvas#scene{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(20,12,30,.35) 100%)}
  .scan{position:fixed;inset:0;pointer-events:none;opacity:.06;background:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 3px)}
  .hud{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));
    background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-radius:18px;padding:12px 16px 12px 14px;box-shadow:0 6px 0 rgba(43,34,56,.18),0 10px 30px rgba(20,10,40,.18);
    border:2px solid rgba(43,34,56,.12);max-width:min(78vw,330px);transition:opacity .4s}
  .hud h1{margin:0 0 2px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:800}
  .hud .big{display:flex;align-items:center;gap:10px}
  .hud .icon{font-size:30px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08))}
  .hud .temp{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .hud .desc{font-size:14px;font-weight:700;line-height:1.25}
  .hud .place{font-size:12.5px;color:var(--soft);margin-top:4px;font-weight:600}
  .hud .tag{display:inline-block;background:#fbe3d3;color:#9c4b31;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;margin-left:4px;vertical-align:1px}
  .controls{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
  .sound{pointer-events:auto;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:17px;color:var(--ink);
    background:var(--paper);padding:14px 22px;border-radius:999px;box-shadow:0 5px 0 #c9a98c,0 12px 28px rgba(20,10,40,.25);
    display:flex;align-items:center;gap:10px;transition:transform .12s, box-shadow .12s}
  .sound:active{transform:translateY(3px);box-shadow:0 2px 0 #c9a98c,0 6px 16px rgba(20,10,40,.25)}
  .sound .dot{width:12px;height:12px;border-radius:50%;background:#d9cbbd}
  .sound.on .dot{background:#7ccf8f;box-shadow:0 0 0 4px rgba(124,207,143,.25);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 7px rgba(124,207,143,.08)}}
  .chips{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:min(96vw,760px);padding:0 8px}
  .group{display:flex;gap:4px;background:rgba(255,246,233,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:4px;border-radius:999px}
  .chip{border:0;font:inherit;font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--paper);box-shadow:0 2px 0 rgba(43,34,56,.18)}
  .toggle{pointer-events:auto;border:0;background:rgba(255,246,233,.55);font:inherit;font-weight:800;font-size:12px;color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .chips[hidden]{display:none}
  .vol{pointer-events:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;background:rgba(255,246,233,.55);padding:4px 12px;border-radius:999px;backdrop-filter:blur(6px)}
  .vol input{accent-color:#e98a6b;width:110px}
  .sndpanel{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:min(96vw,760px)}
  .sndpanel[hidden]{display:none}
  .sndpanel .row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-items:center}
  .tracks{flex-wrap:wrap;justify-content:center;border-radius:18px}
  .now{font-size:12px;font-weight:700;color:var(--ink);background:rgba(255,246,233,.7);padding:3px 12px;border-radius:999px}
  .nav{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));text-decoration:none;font-weight:800;font-size:13px;color:var(--ink);
    background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 13px;border-radius:999px;box-shadow:0 4px 0 rgba(43,34,56,.16)}
  .hud,.nav,.controls,.controls>*{transition:opacity 1s ease}
  .idle-ui .hud,.idle-ui .nav,.idle-ui .controls{opacity:0;pointer-events:none}
  .hide-ui .nav{opacity:0;pointer-events:none}
  .hide-ui .hud,.hide-ui .controls>*:not(.sound){opacity:0;pointer-events:none}
  @media (max-width:520px){.hud{padding:10px 12px}.hud .temp{font-size:26px}.chip{font-size:12px;padding:6px 8px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="A cozy pixel-art bookstore: a couple naps under a blanket on a leather loveseat while the weather drifts past the window" role="img"></canvas>
<div class="vignette"></div><div class="scan"></div>

<section class="hud" id="hud" aria-live="polite">
  <h1>Outside the window</h1>
  <div class="big"><span class="icon" id="icon">☁️</span><span class="temp" id="temp">--°</span></div>
  <div class="desc" id="desc">Peeking outside…</div>
  <div class="place" id="place">finding your little corner of the world</div>
</section>
<a class="nav" href="./">🏡 Village →</a>

<div class="controls">
  <div class="chips" id="chips" hidden>
    <div class="group" data-k="season">
      <button class="chip" data-v="auto" aria-pressed="true">auto</button>
      <button class="chip" data-v="spring">🌸 spring</button>
      <button class="chip" data-v="summer">🌻 summer</button>
      <button class="chip" data-v="autumn">🍂 autumn</button>
      <button class="chip" data-v="winter">❄️ winter</button>
    </div>
    <div class="group" data-k="weather">
      <button class="chip" data-v="auto" aria-pressed="true">auto</button>
      <button class="chip" data-v="clear">☀️</button>
      <button class="chip" data-v="cloudy">☁️</button>
      <button class="chip" data-v="rain">🌧️</button>
      <button class="chip" data-v="snow">🌨️</button>
      <button class="chip" data-v="fog">🌫️</button>
      <button class="chip" data-v="storm">⛈️</button>
    </div>
    <div class="group" data-k="time">
      <button class="chip" data-v="auto" aria-pressed="true">auto</button>
      <button class="chip" data-v="day">day</button>
      <button class="chip" data-v="night">night</button>
    </div>
  </div>
  <div class="sndpanel" id="sndPanel" hidden>
    <div class="now" id="nowPlaying"></div>
    <div class="group tracks" id="tracks" role="group" aria-label="Pick a track"></div>
    <div class="row"><label class="vol">vol <input id="vol" type="range" min="0" max="100" value="55" aria-label="Volume"></label>
      <button class="toggle" id="dust" aria-pressed="false" title="very soft record dust, off by default">🎞️ dust off</button></div>
  </div>
  <div style="display:flex;gap:8px;pointer-events:none;flex-wrap:wrap;justify-content:center">
    <button class="toggle" id="chipToggle" aria-expanded="false">✨ change the weather outside</button>
  </div>
  <button class="sound" id="sound" aria-pressed="false"><span class="dot"></span><span id="soundLabel">Start lofi sound</span></button>
</div>

<script src="weather.js"></script>
<script src="lofi.js"></script>
<script src="bookstore.js"></script>
<script>(()=>{let t;const b=document.body,wake=()=>{b.classList.remove('idle-ui');clearTimeout(t);t=setTimeout(()=>b.classList.add('idle-ui'),60000)};['pointerdown','pointermove','touchstart','keydown','wheel'].forEach(e=>addEventListener(e,wake,{passive:true,capture:true}));wake();})();</script>
</body>
</html>
